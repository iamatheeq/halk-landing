server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security / privacy headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;

    # Cache hashed Vite assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Brand / screens / favicon — medium cache
    location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Large APK download — stream, no buffer, longer timeouts
    location /downloads/ {
        # Allow large file (APK ~95 MB)
        client_max_body_size 120m;
        proxy_max_temp_file_size 0;
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        # Encourage download rather than inline open in some browsers
        add_header Content-Disposition 'attachment' always;
        expires 1d;
        try_files $uri =404;
    }

    # SPA fallback: every non-file route → index.html (for /privacy, /terms, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optional: deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
